[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-bridge"
version = "0.1.0"
description = "Bridge de impresion automatica para comandas por area"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "firebase-admin==6.5.0",
  "google-cloud-firestore==2.17.2"
]

[project.scripts]
printer-bridge = "printer_bridge.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]